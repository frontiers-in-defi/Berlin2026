- id: 12
  name: "Olivier"
  surname: "Guéant"
  company: "Université Paris Cité"
  talkTitle: "Perpetual Futures and Funding Rates: A Stackelberg Perspective"
  abstract: "This paper studies the design of funding mechanisms in perpetual
futures markets through a Stackelberg game between a trading platform
and a representative arbitrageur. The platform chooses a
funding-payment process to keep the perpetual futures price aligned
with the spot price while avoiding excessive transfers that may
destabilize the market or discourage participation. In response, the
trader optimally builds positions in the spot and perpetual markets,
accounting for trading costs, permanent price impact, and inventory
risk. We characterize the trader's optimal response through a
linear-quadratic stochastic control problem and derive the platform's
optimal policy as the solution of a coupled forward-backward
stochastic differential equation. The resulting framework provides a
numerically tractable model for studying how transfer mechanisms shape
arbitrage incentives and market stability in perpetual futures markets
"
  title: ""
  bio: "Olivier Guéant is Full Professor of Applied Mathematics at Université Paris Cité and a member of the LPSM (Laboratoire de Probabilités, Statistiques et Modélisation). He is co-director of the M2MO programme, formerly known as DEA Laure Elie. After a PhD on mean field games under the supervision of Pierre-Louis Lions, he worked in mathematical finance and published papers on a wide range of topics including market microstructure, market making, option pricing, portfolio optimization, and decentralized finance."
  thumbnailUrl: "oliver.jpg"
  role: "speaker"

- id: 13
  name: "Robert"
  surname: "Ślepaczuk"
  company: "University of Warsaw"
  talkTitle: "Informer in Algorithmic Investment Strategies on High-Frequency Bitcoin Data"
  abstract: "We investigate the usage of the Informer architecture for building automated trading strategies for high-frequency Bitcoin data. Three strategies using the Informer model with different loss functions: Root Mean Squared Error (RMSE), Generalized Mean Absolute Directional Loss (GMADL), and Quantile loss, are proposed and evaluated against the Buy and Hold benchmark and two benchmark strategies based on technical indicators. The evaluation is conducted using data of various frequencies: 5-min, 15-min, and 30-min intervals, over the 6 different periods. Although the Informer-based model with Quantile loss did not outperform the benchmark, two other models achieved better results. The performance of the model using RMSE loss worsens when used with higher frequency data, while the model that uses the novel GMADL loss function benefits from higher frequency data. When trained on 5-min intervals, it beats all the other strategies on most of the testing periods. The primary contribution of this study is the application and assessment of the RMSE, GMADL, and Quantile loss functions with the Informer model to forecast future returns, subsequently using these forecasts to develop automated trading strategies. The research provides evidence that employing an Informer model trained with the GMADL loss function can result in superior trading outcomes compared to the Buy&Hold approach."
  title: ""
  bio: "Associate Professor at the Faculty of Economic Sciences, University of Warsaw (UW), Head of the Department of Quantitative Finance and Machine Learning (DoQFaML), and Head of the Quantitative Finance Research Group (QFRG) https://www.wne.uw.edu.pl/en/faculty/structure/departments/quantitative-finance
Robert Ślepaczuk received his PhD from the University of Warsaw in 2005 and obtained his habilitation in economics and finance from the Poznań University of Economics in 2020. He founded the Quantitative Finance Research Group (QFRG) in 2011. Since 2023, he has served as Associate Professor at the University of Warsaw and Head of the Department of Quantitative Finance and Machine Learning. linkedin profile
His research focuses on algorithmic trading, quantitative investment strategies, financial econometrics, derivatives pricing, volatility modelling, and machine learning applications in finance. In particular, his work addresses algorithmic trading systems across multiple asset classes, volatility indicators based on high-frequency option data (such as the VIX), and the modelling and forecasting of financial markets. 
He has more than 20 years of experience in algorithmic trading and quantitative investment strategies, combining academic research with practical industry experience. Previously, he served as Investment Director of the quantitative fund management division at Union Investment TFI, where he specialized in the design and implementation of automated investment strategies for futures and options across various asset classes, including volatility products and cryptocurrencies. Currently, his practical work focuses on auditing algorithmic investment strategies used by hedge funds. googlescholar Scopus
Robert Ślepaczuk holds an Investment Adviser license (no. 316) and a Securities Broker license (no. 2245). He is the author of numerous scientific publications and has led or participated in many research projects funded by national and international institutions. He has supervised more than 100 bachelor’s and master’s theses and currently supervises eight PhD students. Teams from the University of Warsaw under his supervision have repeatedly achieved top results in the Rotman European and International Trading Competitions (RETC and RITC)."
  thumbnailUrl: "zdjecie_RS.png"
  role: "speaker"
  social:
    - {name: "site", link: "www.ogueant.com"}

- id: 14
  name: "Walter"
  surname: "Hernandez"
  company: "University College London"
  talkTitle: "No Questions Asked: Effects of Transparency on Stablecoin Liquidity During the Collapse of Silicon Valley Bank"
  abstract: "Fiat-pegged stablecoins are by nature exposed to spillover effects during market turmoil of Traditional Finance (TradFi). Particularly, the collapse of Silicon Valley Bank (SVB) in March 2023 presents a natural experiment for analyzing how disclosed adverse reserve exposure transmits through Decentralized Exchange (DEX) liquidity for USDC and USDT. The former with a higher reporting frequency and transparency than the latter. Therefore, we conduct an empirical study that adapts the Marginal Cost of Immediacy (MCI) measure to Uniswap's Automated Market Maker (AMM) protocol, examining top USDC and USDT liquidity pools, and then conducting Difference-in-Differences (DiD) estimation on MCI and analysis on Total Value Locked (TVL) in USD, as well as measuring liquidity concentration across different providers. Results show that the SVB event reduced USDC's TVL, diminishing its market dominance over USDT while raising USDC's liquidity cost between 600% to 1000% relative to USDT. Our findings are consistent with a flight-to-safety behavior and with conditional effects of disclosure on stability: USDC's frequent and detailed disclosures led to violent market reactions in Decentralized Finance (DeFi) liquidity provision, while USDT, whose exposure remained unverified, experienced comparatively muted effects."
  title: ""
  bio: "Walter Hernandez Cruz is a final PhD candidate in Computer Science at the University College London (UCL)'s Centre for Blockchain Technologies (CBT), and part of the Financial Computing and Analytics Group at the department of Computer Science at University College London. He is also a Science Fellow at Exponential Science foundation, based in Switzerland. As part of his PhD and as a Science Fellow at Exponential Science, he is currently researching, but not limited to, topics around Decentralized Finance (DeFi), Automated Market Makers (AMM), Stablecoins, and Natural Language Processing (NLP) applied to Distributed Ledger Technology (DLT) domain. His most recent work includes analyzing stablecoins behavior in DeFi during market shocks in the banking sector, the evolution of Distributed Ledger Technologies (DLTs) using NLP, and comparing AMMs performance across blockchain platforms. Walter also contributes to the UK Centre for Blockchain Technologies"
  thumbnailUrl: "walter.jpeg"
  role: "speaker"

- id: 15
  name: "Co-Pierre"
  surname: "Georg"
  company: "Frankfurt School of Finance & Management"
  talkTitle: "The (In-)Finite Money Glitch"
  abstract: "The infinite money glitch is the strategy where a firm issues convertible debt to purchase crypto assets-primarily Bitcoin-which increases its stock's volatility, in turn boosting hedge fund demand for its convertible bonds and enabling the company to issue even more debt to buy more crypto assets in a self-reinforcing cycle. I build a three-date equilibrium model in which convertible issuance, hedging motives, and an inelastic Bitcoin market jointly determine pricing and deal size. Convertible-arbitrage hedge funds dynamically short and cover the stock as it moves, which transmits Bitcoin shocks into realized equity volatility and raises the value of the conversion option in subsequent issues, supporting further issuance and purchases of Bitcoin. The model shows that, if conversion fails at maturity, forced Bitcoin sales can trigger large drawdowns when sell-side impact is steep, tradable supply is thin, and prior issuance was large. This yields non-monotonic effects: looser intermediation lifts prices near term but increases expected liquidation later, with testable implications for the implied-realized volatility gap, stock-loan tightness, and free-float measures."
  title: ""
  bio: "Co-Pierre Georg is Professor of Practice in Digital Finance and Technology and Director of the Frankfurt School Blockchain Center at Frankfurt School of Finance & Management. His research spans financial stability, blockchain protocol design, tokenomics, CBDCs, and crypto markets, with publications in leading journals including the Journal of Financial Economics, Journal of Economic Theory, Operations Research, Research Policy, and Nature Physics. Previously, he held the DSI/NRF Dual Research Chair in Blockchain Technologies and SARB Chair in Financial Stability Studies at the University of Cape Town, where he founded the Financial Innovation Hub and a FinTech Master's program; earlier roles include economist at the Deutsche Bundesbank Research Centre and Associate Professor at EDHEC Business School. Funded by initiatives like Ripple's UBRI and the Algorand Foundation, his work bridges academia and industry on crypto economics, privacy in distributed systems, and digital property rights. He held visiting positions at MIT, Oxford, Columbia, and Princeton."
  thumbnailUrl: "Georg_new.png"
  role: "speaker"
  social:
    - {name: "site", link: "https://cogeorg.github.io"}

- id: 16
  name: "Barbara"
  surname: "Będowska-Sójka"
  company: "Poznań University of Economics and Business"
  talkTitle: "Early warning systems fo cryptocurrency markets: Predicting 'zombie' assets using machine learning"
  abstract: "The cryptocurrency market harbours a hidden risk: assets that silently disappear from trading, leaving investors stranded. These ‘zombie’ cryptocurrencies technically exist but become temporarily untradable on exchanges, ranging from weeks to permanent delisting. This study predicts which cryptocurrencies are at risk of becoming zombies using predictors derived from return statistics, trading volume, market capitalisation, and asset-specific features. Our sample includes cryptocurrencies listed for at least 210 days between January 2015 and December 2022. We employ various machine learning algorithms and novel explainable AI (XAI) tools, including permutation-based feature importance and partial dependence plots (PDPs), to identify and analyse key factors influencing zombification risk. Our machine learning models achieve 84% out-of-time balanced accuracy in predicting whether a cryptocurrency will become a zombie within the next 28 days. Tree-based approaches, particularly random forests, significantly outperform traditional econometric methods. Trading volumes and past returns emerge as the most influential predictors."
  title: ""
  thumbnailUrl: "Barbara.jpg"
  rockstar: true
  role: "speaker"
  
- id: 17
  name: "Michele"
  surname: "Fabi"
  company: "Télécom Paris"
  talkTitle: "Tokenized Governance: Delegation, Agency, and Cycles"
  abstract: "Token-based platform governance has evolved into a mediated voting system, in which users outsource voting to specialized agents. While this \textit{vote delegation} can improve governance efficiency, it also reintroduces agency conflicts. We develop a dynamic principal-agent model in which agents are initially unknown and exert effort to build reputation. However, as perceived quality (reputation) rises, users rationally reduce active oversight. This decline in monitoring increases agents' returns to opportunism and misconduct, eventually leading to governance failures and agent turnover. To mitigate these governance cycles, we show that designs that slow reputation accumulation and use token-based compensation improve the platform's stability."
  title: ""
  bio: "Michele Fabi is an Assistant Professor at Télécom Paris, affiliated with CREST and the Institut Polytechnique de Paris. His work applies game theory to financial economics to analyze topics such as blockchain ecosystems, energy markets. startup finance, and the digitalization of money."
  thumbnailUrl: "fabi.jpg"
  role: "speaker"
  
- id: 18
  name: "Simon"
  surname: "Trimborn"
  company: "Amsterdam School of Economics, University of Amsterdam"
  talkTitle: "The Geographic Origigns of Blockchain Transactions"
  abstract: "We investigate the transaction patterns of Bitcoin users by their geographical origin and design Random Forest architectures to obtain indices for the share of transactions per region. We show that North American and European users transaction flows have a stronger market relationship than global flows. Using the indices, trained on a unique dataset spanning 5 years of blockchain transactions and their associated geographical origin, we construct region-specific blockchain metrics which we show improve market modelling and prediction as compared to the global metrics. We further show with the indices regional differences in users willingness to pay transaction fees."
  title: ""
  bio: "I am an Assistant Professor of Econometrics and Data Science at the Amsterdam School of Economics, University of Amsterdam. Before joining the UvA, I held academic positions at City University of Hong Kong and National University of Singapore following my PhD studies at the Humboldt-University at Berlin (Humboldt-Universität zu Berlin), where I defended my PhD thesis on the topic of Statistics of Digital Finance. My work focuses on high dimensional data analysis for time series with which I tackle specific problems arising in social media, cryptocurrency, blockchain and finance. My work makes contributions to network modelling, social media analytics, sustainable finance, and blockchain analytics. These studies appear in journals such as Journal of Financial Econometrics, Journal of Empirical Finance, R Journal, among others. I serve on the editorial board of the journals Digital Finance, Statistics, Statistical Methods and Applications, as well as Annual Review of FinTech. I am on the Scientific Board of the CRIX index, program manager of the AI4FinTech initiative at the UvA, and the regional chair of the Society for Algorithmic intelligence."
  thumbnailUrl: "unnamed.jpg"
  role: "speaker"

- id: 19
  name: "Janos"
  surname: "Tapolcai"
  company: "Budapest University of Technology and Economics"
  talkTitle: "Where Does MEV Really Come From? Revisiting CEX-DEX Arbitrage on Ethereum"
  abstract: "A central question of the Ethereum ecosystem is where Maximal Extractable Value (MEV) revenue originates and to what extent it stems from harming unsuspecting users. It is acceptable if MEV arises from arbitrages between centralised and decentralised exchanges (CEX--DEX).  Yet theoretical models have significantly underestimated the scale of these arbitrages, while empirical studies have highlighted their importance -- though these remain conservative estimates, constrained by numerous debatable heuristic assumptions. Revisiting the theoretical model, we found that CEX–DEX arbitrages require trading volumes on the order of the total activity of major liquidity pools and yield profits comparable to MEV. Most prior AMM models utilised the Black–Scholes (BS) stochastic differential equation (SDE) -- i.e., geometric Brownian motion -- and assumed continuous price trajectories where asset prices move in small increments only.  We argue that BS underestimates arbitrage profits by ignoring price jumps, which are precisely the points at which arbitrage opportunities tend to arise. To address this gap, we present an extended discrete-time AMM model in which the price process is the sum of a diffusive component and stochastic jumps that can have arbitrary noise distributions. Although mathematically more involved this framework allows us to employ a general discrete-time SDE and compute the stationary probability distribution via function iteration with geometric convergence. We further prove that the resulting mispricing process is an ergodic Markov chain. We implement our model in C++, collect spot prices and AMM exchange data from the Ethereum blockchain and fit the model parameters to the observed prices. The estimates derived from our model closely match empirical observations and provide a natural theoretical explanation for several fundamental questions in the blockchain ecosystem."
  title: ""
  bio: "János Tapolcai received the M.Sc. degree in technical informatics and the Ph.D. degree in computer science from the Budapest University of Technology and Economics (BME), Budapest, in 2000 and 2005, respectively, and the D.Sc. degree in engineering science from the Hungarian Academy of Sciences (MTA) in 2013. He is currently a Full Professor with the High-Speed Networks Laboratory, Department of Telecommunications and Artificial Intelligence, BME. He has authored over 200 scientific publications. He is a winner of the MTA Lendület Program and the Google Faculty Award in 2012, Microsoft Azure Research Award in 2018. He is a TPC member of leading conferences, e.g. IEEE INFOCOM 2012-2024, ACM Sigmetrics 2026 and the general chair of ACM SIGCOMM 2018."
  thumbnailUrl: "tapolcai_janos.jpg"
  role: "speaker"  
