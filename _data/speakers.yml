- id: 9
  name: "Aviv"
  surname: "Yaish"
  company: "Yale University"
  talkTitle: "Inequality in the Age of Pseudonymity"
  abstract: "Inequality measures such as the Gini coefficient inform and motivate policymaking, and are increasingly applied to digital platforms. We analyze how these measures perform in pseudonymous settings that are common in the digital age. A key challenge in such environments is the ability of actors to create fake identities under fictitious false names, also known as ``Sybils.'' While actors may do this to preserve privacy, we show that it can hamper inequality measurement: it is impossible for measures satisfying the literature's canonical set of desired properties to assess the inequality of an economy harboring Sybils. We characterize the class of all Sybil-proof measures, and prove they must satisfy relaxed versions of the established properties. Furthermore, we show that the imposed structure restricts the ability to assess inequality at a fine-grained level. We then apply our results to prove that popular measures are not Sybil-proof, with the famous Gini coefficient being but one example out of many. Finally, we examine the dynamics leading to the creation of Sybils in digital and traditional settings."
  title: ""
  bio: "Aviv Yaish is a Postdoctoral Associate at Yale University, where he makes and breaks distributed systems by bridging economic theory and practical systems security. His approach is driven by a philosophy of constructive deconstruction: pushing systems to their limits is key to making them robust. His contributions have been recognized by several communities: security (CCS Distinguished Paper), economics (Annual CBER Best Paper), and industry (bounties from the Ethereum Foundation and Flashbots). He is currently a member of the Initiative for Cryptocurrencies & Contracts (IC3), and is a junior external faculty at Vienna's Complexity Science Hub. He earned his Ph.D. in Computer Science from the Hebrew University, where he served as the sole lecturer for two courses and received a teaching excellence award. During his studies, he was also a research consultant at Matter Labs. His honors include the AIANI and Jabotinsky fellowships, and inclusion in CBER's Rising Stars and the Hebrew University's 40 Under 40 lists."
  thumbnailUrl: "Aviv-Yanish.jpg"
  role: "speaker"
  social:
    - {name: "site", link: "https://aviv.yai.sh/"}

- id: 10
  name: "Massimo"
  surname: "Bartoletti"
  company: "University of Cagliari"
  talkTitle: "LLMs as verification oracles for Solidity"
  abstract: "Ensuring the correctness of smart contracts is critical, as even subtle flaws can lead to severe financial losses. While bug detection tools able to spot common vulnerability patterns can serve as a first line of defense, most real-world exploits and losses stem from errors in the contract business logic. Formal verification tools address this challenge, but their impact remains limited by steep learning curves and restricted specification languages. Recent works have begun to explore the use of large language models (LLMs) for security-related tasks such as vulnerability detection and test generation. Yet, a fundamental question remains open: can LLMs aid in assessing the validity of arbitrary contract-specific properties? In this talk, we present the first systematic empirical evaluation of GPT-5, a state-of-the-art reasoning LLM, in this role. We benchmark its performance on a large dataset of verification tasks, compare its outputs against those of established formal verification tools, and assess its practical effectiveness in real-world auditing scenarios. Our study combines quantitative metrics with qualitative analysis, and shows that recent reasoning-oriented LLMs - although lacking soundness guarantees - can be surprisingly effective at predicting the (in)validity of complex properties, suggesting a new frontier in the convergence of AI and formal methods for secure smart contract development and auditing."
  title: ""
  bio: "Massimo Bartoletti is Associate Professor at the Department of Mathematics and Computer Science of the University of Cagliari. His research activity concerns the development of tools and techniques for the specification, analysis and verification of software, with a special emphasis on security and formal methods. Massimo Bartoletti is founder of the laboratory Blockchain@Unica, one of the first academic research group on blockchain technologies in Italy, director of the node of the Cyber Security National Lab for the University of Cagliari, and core member of the CINI working group on Blockchain. The laboratory is currently investigating several aspects of blockchain technologies, among which custom Domain-Specific Languages for smart contracts. He is principal investigator of R&D projects on blockchain technologies, and program committee member of top-tier conferences on blockchain technologies, including ACM CCS - blockchain track and Financial Cryptography. He is the organizer of the DLT Workshop series, of the Scientific School on Blockchain & DLT series, and of the Workshop on Distributed Ledger Technologies and Formal Methods series. Massimo Bartoletti has published over 50 scientific papers on blockchain technologies since 2016, and it has presented his research in top-tier conferences like ACM CCS, Financial Cryptography, Computer Security Foundations, IEEE Security and Privacy Europe, and ESEC/SIGSOFT FSE."
  thumbnailUrl: "pic-bart.png"
  role: "speaker"

- id: 11
  name: "Lorenzo"
  surname: "Schönleber"
  company: "Collegio Carlo Alberto / University of Turin"
  talkTitle: "Market Efficiency in Prediction Markets - A Comparison with Derivatives"
  abstract: "We study pricing efficiency in decentralized prediction markets by comparing market-implied probabilities from Polymarket with benchmarks derived from option-implied risk-neutral distributions extracted from the derivatives market. We study Bitcoin and Ethereum prediction bets and find that, although Polymarket prices broadly track option-implied benchmarks, they show systematic mispricing driven by behavioral factors and market frictions. Mispricing is most pronounced in tail events, during periods of high volatility, major macroeconomic shocks, and reflects the influence of sentiment, attention, and blockchain-specific risks. These results reveal both efficiency and behavioral distortions in prediction markets."
  title: ""
  bio: "Lorenzo Schönleber is an Assistant Professor at the Collegio Carlo Alberto and the University of Turin. His areas of interest include asset pricing, particularly option-implied information, and decentralized finance (DeFi). A central part of his current work aims to integrate insights from derivatives into DeFi."
  thumbnailUrl: "LSPic.jpg"
  social:
