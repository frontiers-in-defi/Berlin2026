  id: 002
  title: "Inequality in the Age of Pseudonymity"
  description: "Authors: Wolfgang Karl Härdle<br/>
  <p>Abstract:  Inequality measures such as the Gini coefficient inform and motivate policymaking, and are increasingly applied to digital platforms. We analyze how these measures perform in pseudonymous settings that are common in the digital age. A key challenge in such environments is the ability of actors to create fake identities under fictitious false names, also known as ``Sybils.'' While actors may do this to preserve privacy, we show that it can hamper inequality measurement: it is impossible for measures satisfying the literature's canonical set of desired properties to assess the inequality of an economy harboring Sybils. We characterize the class of all Sybil-proof measures, and prove they must satisfy relaxed versions of the established properties. Furthermore, we show that the imposed structure restricts the ability to assess inequality at a fine-grained level. We then apply our results to prove that popular measures are not Sybil-proof, with the famous Gini coefficient being but one example out of many. Finally, we examine the dynamics leading to the creation of Sybils in digital and traditional settings. </p>"
  subtype: Presentation
  speakers: [1]
  language: en

