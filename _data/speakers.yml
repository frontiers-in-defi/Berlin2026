  #------ Speakers sessions
- id: 8
  name: "Claudio"
  surname: "Tessone"
  company: "University of Zurich"
  talkTitle: "On-Chain Realities: Empirical Evidence on Incentives, Manipulation, and Market Structure in DeFi"
  abstract: "The DeFi ecosystem has matured into complex sociotechnical systems where protocol design, economic incentives, and user behaviour interact in measurable — and often counterintuitive — ways. This talk presents empirical and analytical perspectives across several dimensions of decentralised finance: from consensus-layer staking dynamics and the circulation of value through DeFi protocols, to the forensic reconstruction of manipulation events and the real prevalence of MEV across execution environments. Together, these studies illustrate how rigorous on-chain analytics can expose the gap between protocol design intent and actual economic behaviour, with implications for mechanism design, market integrity, and the future of decentralised finance."
  title: ""
  bio: "Claudio J. Tessone is Professor of Blockchain and Distributed Ledger Technologies at the University of Zurich and co-founder and Chairman of the UZH Blockchain Center — the largest academic blockchain initiative in Switzerland and ranked 1st in Europe by CoinDesk's University Blockchain Rankings. He leads the BDLT research group, whose work spans cryptoeconomics, blockchain analytics and forensics, consensus mechanisms, and the design and analysis of blockchain-based systems. His research adopts an interdisciplinary approach to modelling complex socio-economic and sociotechnical systems, combining large-scale empirical analysis with formal methods. He also directs several educational programmes, including the UZH CAS in Blockchain and the International Summer School: Deep Dive into Blockchain"
  thumbnailUrl: "claudio.png"
  role: "speaker"
  social:
